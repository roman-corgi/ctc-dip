[build-system]
requires = ["setuptools>=61", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
authors = [
    { name = "Al Niessner", email = "Al.Niessner@xxx.xxx.gov" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
description = "ROMAN CGI Data Integration Processor (DIP)"
dynamic = ["version"]
keywords = ["roman", "cgi", "corgi", "corgidrp"]
license-files = ["LICENSE.txt"]
name = "DIP"
readme = "README.md"
requires-python = ">3.11"

[project.urls]
Homepage = "https://roman-corgi.github.io/ctc-dip/"

[tool.setuptools]
packages = { find = {} }

[tool.setuptools.package-data]
"dip.basis" = ["*.dot"]
"dip.base" = ["*.xml"]

[tool.setuptools_scm]
fallback_version = "0.0.0"
version_file = "dip/_version.py"
