[build-system]
requires = ["setuptools>=61", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
authors = [
    { name = "Al Niessner", email = "Al.Niessner@xxx.xxx.gov" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
description = "ROMAN CGI Data Integration Processor (DIP)"
dynamic = ["version"]
keywords = ["roman", "cgi", "corgi", "corgidrp"]
license-files = ["LICENSE.txt"]
name = "DIP"
readme = "README.md"
requires-python = ">3.11"

[project.urls]
Homepage = "https://roman-corgi.github.io/ctc-dip/"

[tool.setuptools]
packages = { find = {} }

[tool.setuptools.package-data]
"dip.basis" = ["*.dot"]
"dip.base" = ["*.xml"]

[tool.setuptools_scm]
fallback_version = "0.0.0"
version_file = "dip/_version.py"
version_file_template = """'''pyproject.toml using git tag to generate the version

    - file generated by vcs-versioning
    - don't change, don't track in version control
'''

from __future__ import annotations

__all__ = [
    '__version__',
    '__version_tuple__',
    'version',
    'version_tuple',
    '__commit_id__',
    'commit_id',
]

version: str
__version__: str
__version_tuple__: tuple[int | str, ...]
version_tuple: tuple[int | str, ...]
commit_id: str | None
__commit_id__: str | None

__version__ = version = {version!r}
__version_tuple__ = version_tuple = {version_tuple!r}

__commit_id__ = commit_id = {scm_version.node!r}
"""